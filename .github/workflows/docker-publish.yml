name: Build Docker Images

on:
  push:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: Publish Docker Image (${{ matrix.platform }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64

    steps:
      - id: fluidd
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: fluidd-core
          repo: fluidd
          excludes: prerelease, draft

      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.platform }},latest=true
          tags: |
            type=raw,value=${{ steps.fluidd.outputs.release }}
          labels: |
            maintainer=maaad
            org.opencontainers.image.title=fluidd-farm
            org.opencontainers.image.description=fluidd-core
            org.opencontainers.image.vendor=fluidd-core

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PUSH_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            FLUIDD_VERSION=${{ steps.fluidd.outputs.release }}
          platforms: linux/${{ matrix.platform }}
          push: true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  post-build:
    name: Create multi-arch manifest
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - id: fluidd
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: fluidd-core
          repo: fluidd
          excludes: prerelease, draft

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{ steps.fluidd.outputs.release }}
          labels: |
            maintainer=maaad
            org.opencontainers.image.title=fluidd-farm
            org.opencontainers.image.description=fluidd-core
            org.opencontainers.image.vendor=fluidd-core

      - name: Create multi-arch manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          index-annotations: ${{ steps.meta.outputs.labels }}
          sources: |
            ghcr.io/${{ github.repository }}:${{ steps.fluidd.outputs.release }}-amd64
            ghcr.io/${{ github.repository }}:${{ steps.fluidd.outputs.release }}-arm64

      - name: Delete all containers from repository without tags
        uses: Chizkiyahu/delete-untagged-ghcr-action@v6
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          untagged_only: true
          owner_type: user

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          retain_days: 1
          keep_minimum_runs: 3
